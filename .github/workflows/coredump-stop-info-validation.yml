name: Validate CPU coredump stop information
on:
  push:
    branches: [ci/coredump-stop-info-20261013]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c18daed286b0f83aee4420c0ee23d73f3cf0d345
          submodules: recursive
          fetch-depth: 3
          persist-credentials: false
      - name: Install runtime build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers libpipewire-0.3-dev libpulse-dev libasound2-dev libxrandr-dev
      - name: Configure Release runtime and tests
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build runtime, relinker and coredump regression
        run: cmake --build build --target libs relinker guest_coredump_attach_tests --parallel 4
      - name: Check coredump behavior and patched libraries five times
        run: ctest --test-dir build -R '^(guest_coredump_attach|patched_libraries)$' --repeat until-fail:5 --output-on-failure --no-tests=error
      - name: Check conventions and registration
        run: |
          python tools/check_conventions.py --base 510a2188cf4ea505dd58b3d5fc80ae3af2680c38
          python tools/check_test_registration.py build
          git diff --check 510a2188cf4ea505dd58b3d5fc80ae3af2680c38 HEAD
      - name: Build the new test against main's coredump implementation
        run: |
          git restore --source 510a2188cf4ea505dd58b3d5fc80ae3af2680c38 --worktree -- core/libs/prx/libkernel/System/src/Coredump.cpp
          cmake --build build --target guest_coredump_attach_tests --parallel 4
      - name: Require failure at main's unimplemented CPU stop-info query
        run: |
          python - <<'PY'
          import subprocess
          result = subprocess.run(['ctest', '--test-dir', 'build', '-R', '^guest_coredump_attach$', '--output-on-failure', '--no-tests=error'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          print(result.stdout)
          assert result.returncode != 0 and 'kK0DUW1Ukgc' in result.stdout, 'main did not fail at the expected CPU stop-info stub'
          PY
      - name: Restore the exact PR source and repeat the checks
        if: always()
        run: |
          git restore --source HEAD --worktree -- core/libs/prx/libkernel/System/src/Coredump.cpp
          cmake --build build --target libs guest_coredump_attach_tests --parallel 4
          ctest --test-dir build -R '^(guest_coredump_attach|patched_libraries)$' --repeat until-fail:5 --output-on-failure --no-tests=error
          git diff --exit-code
