name: Validate vertex user-data tails
on:
  push:
    branches: [ci/rebase3763-4821-oct13]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANYPS5_REQUIRE_VULKAN: '1'
      GALLIUM_OVERRIDE_CPU_CAPS: avx
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 05ba2e40133fbfefefcfeb53ed808e8d8357e4d4
          submodules: recursive
          fetch-depth: 4
          persist-credentials: false
      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers libpipewire-0.3-dev libpulse-dev libasound2-dev libxrandr-dev
      - name: Configure Release runtime and tests
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build runtime and regression tests
        run: cmake --build build --target libs relinker agc_driver_graphics_tests agc_driver_vertex_clip_cull_draw_tests agc_driver_vertex_clip_cull_distances_tests agc_driver_layered_volume_draw_tests agc_driver_layered_volume_submit_tests agc_vertex_layer_export_tests agc_shader_memory_tests agc_driver_vertex_user_data_tail_tests agc_shader_control_flow_tests agc_driver_tests agc_driver_compute_user_data_calls_tests agc_driver_scalar_setpc_tests agc_driver_prepared_graphics_tests agc_driver_prepared_unregistered_graphics_tests --parallel 4
      - name: Run graphics, cache and control-flow tests
        run: ctest --test-dir build -R '^(agc_driver_graphics|agc_driver_vertex_clip_cull_.*|agc_driver_layered_volume_.*|agc_vertex_layer_export|agc_shader_memory|agc_driver_vertex_user_data_tail|agc_shader_control_flow|agc_driver|agc_driver_compute_user_data_calls.*|agc_driver_scalar_setpc|agc_driver_prepared_graphics|agc_driver_prepared_unregistered_graphics)$' --output-on-failure --no-tests=error
      - name: Conventions, test registration and patch whitespace
        run: |
          python tools/check_conventions.py --base 075169f7b3faeae1216efc35df41c44fac9f3190
          python tools/check_test_registration.py build
          git diff --check 075169f7b3faeae1216efc35df41c44fac9f3190 HEAD
      - name: Prove the continuation clip-distance regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('core/libs/prx/libSceAgcDriver/Execution/src/Driver/Shaders/ShaderRegistry.cpp')
          original = path.read_bytes()
          line = b'    if (continuation != nullptr && PositionExportLayout(continuation, 0, continuation->code, bits) != 0) return bits;'
          assert original.count(line) == 1
          try:
              path.write_bytes(original.replace(line, b''))
              subprocess.run(['cmake', '--build', 'build', '--target', 'libs', 'agc_driver_vertex_user_data_tail_tests', '--parallel', '4'], check=True)
              result = subprocess.run(['ctest', '--test-dir', 'build', '-R', '^agc_driver_vertex_user_data_tail$', '--output-on-failure', '--no-tests=error'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(result.stdout)
              assert result.returncode != 0 and 'linked vertex tail pixels differ' in result.stdout
          finally:
              path.write_bytes(original)
          PY
      - name: Replace changed existing sources with main for the negative control
        run: |
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=M', '075169f7b3faeae1216efc35df41c44fac9f3190', 'HEAD', '--', 'core'], text=True).splitlines()
          subprocess.run(['git', 'restore', '--source', '075169f7b3faeae1216efc35df41c44fac9f3190', '--worktree', '--', *paths], check=True)
          PY
          cmake --build build --target libs agc_driver_vertex_user_data_tail_tests --parallel 4
      - name: Require the new pixel test to fail at main's unresolved tail jump
        run: |
          python - <<'PY'
          import subprocess
          result = subprocess.run(['ctest', '--test-dir', 'build', '-R', '^agc_driver_vertex_user_data_tail$', '--output-on-failure', '--no-tests=error'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          print(result.stdout)
          assert result.returncode != 0 and 'unsupported dynamic s_setpc_b64' in result.stdout, 'main did not fail at the expected unresolved tail'
          PY
      - name: Restore the exact source revision and retest
        run: |
          git restore --source HEAD --worktree .
          cmake --build build --target libs relinker agc_driver_graphics_tests agc_driver_vertex_clip_cull_draw_tests agc_driver_vertex_clip_cull_distances_tests agc_driver_layered_volume_draw_tests agc_driver_layered_volume_submit_tests agc_vertex_layer_export_tests agc_shader_memory_tests agc_driver_vertex_user_data_tail_tests agc_shader_control_flow_tests agc_driver_tests agc_driver_compute_user_data_calls_tests agc_driver_scalar_setpc_tests agc_driver_prepared_graphics_tests agc_driver_prepared_unregistered_graphics_tests --parallel 4
          ctest --test-dir build -R '^(agc_driver_graphics|agc_driver_vertex_clip_cull_.*|agc_driver_layered_volume_.*|agc_vertex_layer_export|agc_shader_memory|agc_driver_vertex_user_data_tail|agc_shader_control_flow|agc_driver|agc_driver_compute_user_data_calls.*|agc_driver_scalar_setpc|agc_driver_prepared_graphics|agc_driver_prepared_unregistered_graphics)$' --output-on-failure --no-tests=error
