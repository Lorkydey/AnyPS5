name: Validate fragment user-data tails
on:
  push:
    branches: [ci/reviewfix-4840-oct13]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANYPS5_REQUIRE_VULKAN: '1'
      GALLIUM_OVERRIDE_CPU_CAPS: avx
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e229262449157afcc1544448c9724a80bdb2636d
          submodules: recursive
          fetch-depth: 8
          persist-credentials: false
      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers libpipewire-0.3-dev libpulse-dev libasound2-dev libxrandr-dev
      - name: Configure Release runtime and tests
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
      - name: Build runtime and regression tests
        run: cmake --build build --target libs relinker agc_driver_graphics_tests agc_driver_vertex_clip_cull_draw_tests agc_driver_vertex_clip_cull_distances_tests agc_driver_layered_volume_draw_tests agc_driver_layered_volume_submit_tests agc_vertex_layer_export_tests agc_shader_memory_tests agc_driver_vertex_user_data_tail_tests agc_shader_control_flow_tests agc_driver_tests agc_driver_compute_user_data_calls_tests agc_driver_scalar_setpc_tests agc_driver_prepared_graphics_tests agc_driver_prepared_unregistered_graphics_tests agc_driver_fragment_user_data_tail_tests --parallel 4
      - name: Run graphics, cache and control-flow tests
        run: ctest --test-dir build -R '^(agc_driver_graphics|agc_driver_vertex_clip_cull_.*|agc_driver_layered_volume_.*|agc_vertex_layer_export|agc_shader_memory|agc_driver_vertex_user_data_tail|agc_shader_control_flow|agc_driver|agc_driver_compute_user_data_calls.*|agc_driver_scalar_setpc|agc_driver_prepared_graphics|agc_driver_prepared_unregistered_graphics|agc_driver_fragment_user_data_tail)$' --output-on-failure --no-tests=error
      - name: Conventions, test registration and patch whitespace
        run: |
          python tools/check_conventions.py --base dacd78525e537a779682032c0ace7f7af120af05
          python tools/check_test_registration.py build
          git diff --check dacd78525e537a779682032c0ace7f7af120af05 HEAD
      - name: Replace changed existing sources with main for the negative control
        run: |
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=M', 'dacd78525e537a779682032c0ace7f7af120af05', 'HEAD', '--', 'core'], text=True).splitlines()
          subprocess.run(['git', 'restore', '--source', 'dacd78525e537a779682032c0ace7f7af120af05', '--worktree', '--', *paths], check=True)
          PY
          cmake --build build --target libs agc_driver_fragment_user_data_tail_tests --parallel 4
      - name: Require the new pixel test to fail at main's unresolved tail jump
        run: |
          python - <<'PY'
          import subprocess
          result = subprocess.run(['ctest', '--test-dir', 'build', '-R', '^agc_driver_fragment_user_data_tail$', '--output-on-failure', '--no-tests=error'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          print(result.stdout)
          assert result.returncode != 0 and 'unsupported dynamic s_setpc_b64' in result.stdout, 'main did not fail at the expected unresolved tail'
          PY
      - name: Verify the preceding vertex-tail fix alone still fails this fragment test
        run: |
          git restore --source HEAD --worktree .
          python - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=M', '7092b01b0daab6afc52ce67d79f5d0f2537b7279', 'HEAD', '--', 'core'], text=True).splitlines()
          subprocess.run(['git', 'restore', '--source', '7092b01b0daab6afc52ce67d79f5d0f2537b7279', '--worktree', '--', *paths], check=True)
          PY
          cmake --build build --target libs agc_driver_fragment_user_data_tail_tests --parallel 4
          python - <<'PY'
          import subprocess
          result = subprocess.run(['ctest', '--test-dir', 'build', '-R', '^agc_driver_fragment_user_data_tail$', '--output-on-failure', '--no-tests=error'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          print(result.stdout)
          assert result.returncode != 0 and 'unsupported dynamic s_setpc_b64' in result.stdout, 'the preceding fix did not fail at the expected unresolved fragment tail'
          PY
      - name: Restore the exact source revision and retest
        run: |
          git restore --source HEAD --worktree .
          cmake --build build --target libs relinker agc_driver_graphics_tests agc_driver_vertex_clip_cull_draw_tests agc_driver_vertex_clip_cull_distances_tests agc_driver_layered_volume_draw_tests agc_driver_layered_volume_submit_tests agc_vertex_layer_export_tests agc_shader_memory_tests agc_driver_vertex_user_data_tail_tests agc_shader_control_flow_tests agc_driver_tests agc_driver_compute_user_data_calls_tests agc_driver_scalar_setpc_tests agc_driver_prepared_graphics_tests agc_driver_prepared_unregistered_graphics_tests agc_driver_fragment_user_data_tail_tests --parallel 4
          ctest --test-dir build -R '^(agc_driver_graphics|agc_driver_vertex_clip_cull_.*|agc_driver_layered_volume_.*|agc_vertex_layer_export|agc_shader_memory|agc_driver_vertex_user_data_tail|agc_shader_control_flow|agc_driver|agc_driver_compute_user_data_calls.*|agc_driver_scalar_setpc|agc_driver_prepared_graphics|agc_driver_prepared_unregistered_graphics|agc_driver_fragment_user_data_tail)$' --output-on-failure --no-tests=error
