name: Validate pthread_setaffinity_np
on:
  push:
    branches: [ci/pthread-setaffinity-np-validation]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 3
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libx11-dev libxext-dev libpipewire-0.3-dev libpulse-dev libasound2-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build the complete project and libraries
        run: |
          cmake --build build --parallel 4
          cmake --build build --target libs --parallel 4
      - name: Verify the regression against main
        shell: bash
        run: |
          git show 33ae282e4e1f6ce23e3c5f4d471d16733d7a38b8:core/libs/prx/libkernel/Pthread/Posix/Thread.cpp > core/libs/prx/libkernel/Pthread/Posix/Thread.cpp
          if cmake --build build --target guest_available_cpumask_tests --parallel 4 > baseline.log 2>&1; then
            cat baseline.log
            echo 'Expected the behavior test to fail linking against main without pthread_setaffinity_np'
            exit 1
          fi
          cat baseline.log
          grep -q 'undefined reference.*pthread_setaffinity_np_nid_postfix' baseline.log
          git restore core/libs/prx/libkernel/Pthread/Posix/Thread.cpp
          cmake --build build --target guest_available_cpumask_tests --parallel 4
      - name: Check affinity behavior
        run: ctest --test-dir build -R '^guest_available_cpumask$' --output-on-failure --no-tests=error --repeat until-fail:5
